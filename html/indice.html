<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- --------------------------------------------------
            PR2 – Índice de Pokémon
        --------------------------------------------------
        Alumna: Alexandra Schäfer Barrientos
        Fitxer: indice.html

        Descripció:
        Pàgina principal de l'aplicació un cop l'usuari ha
        iniciat sessió. Permet cercar, filtrar i ordenar
        els Pokémon disponibles, així com visualitzar-los
        en format de llistat amb càrrega progressiva.
        -------------------------------------------------- -->

        <!-- Icona de la pestanya del navegador -->
        <link rel="icon" type="image/png" href="../img/pikachu.png">

        <!-- Llibreria d'icones utilitzada a la barra de navegació -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

        <!-- Full d'estils principal del projecte -->
        <link rel="stylesheet" href="../css/styles.css">

        <title>Indice de Pokemons</title>
    </head>

    <body>

        <!-- --------------------------------------------------
            MENÚ SUPERIOR (NAVBAR)
        --------------------------------------------------
        Barra de navegació principal de l'aplicació. Inclou
        els enllaços a les diferents pàgines, els comptadors
        associats a les llistes d'usuari i el menú per
        tancar la sessió.
        -------------------------------------------------- -->
        <header>
            <nav class="navbar">

                <!-- Logotip de l'aplicació -->
                <div class="navbar-left">
                    <img src="../img/pokedex-uoc.png" alt="Pokedex UOC">
                </div>

                <!-- Enllaços de navegació -->
                <ul class="navbar-right">
                    <li><a href="indice.html">Pokemons</a></li>

                    <li>
                        <a href="listas.html">
                            <span class="nav-text">Listas</span>

                            <!-- Comptador de Pokémon afegits a "myTeam" -->
                            <i class="fa-solid fa-heart"></i>
                            <span style="font-size: 0.6em;" id="myTeamCount"></span>

                            <!-- Comptador de Pokémon afegits a "wishes" -->
                            <i class="fa-solid fa-eye"></i>
                            <span style="font-size: 0.6em;" id="wishesCount"></span>
                        </a>
                    </li>

                    <li><a href="video.html">Video</a></li>

                    <!-- Menú desplegable d'usuari -->
                    <li class="dropdown">
                        <a href="#" class="dropbtn" id="menuButton">Usuario</a>
                        <div class="dropdown-content">
                            <a href="#" id="logoutButton">Logout</a>
                        </div>
                    </li>
                </ul>

            </nav>
        </header>

        <!-- --------------------------------------------------
            LOADER
        --------------------------------------------------
        Element visual que es mostra mentre es carreguen
        les dades dels Pokémon de forma asíncrona.
        -------------------------------------------------- -->
        <div id="loader"></div>

        <!-- --------------------------------------------------
            CONTENIDOR PRINCIPAL
        --------------------------------------------------
        Conté la zona de filtres, la cerca i els controls
        d'ordenació del llistat.
        -------------------------------------------------- -->
        <div class="top-container">

            <!-- Zona de filtres i cerca -->
            <div class="search-section">

                <!-- Filtre per tipus de Pokémon -->
                <div class="type-filter">
                    <h3>Filtrar por tipo</h3>

                    <ul id="typeList">
                        <!-- Contingut generat dinàmicament amb JavaScript -->
                    </ul>
                </div>

                <!-- Controls de cerca -->
                <div class="search-controls">

                    <!-- Cerca per nom o número -->
                    <div class="input-group">
                        <label for="searchInput" style="width:100%">Buscar por nombre o número</label>
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Ej: Pikachu o 025"
                            autocomplete="off"
                            inputmode="search"
                        >
                    </div>

                    <!-- Rang de pes -->
                    <div class="weight-controls">

                        <div class="input-group">
                            <label for="weightMin">Peso mínimo</label>
                            <input
                                type="number"
                                id="weightMin"
                                min="0"
                                placeholder="0"
                            >
                        </div>

                        <div class="input-group">
                            <label for="weightMax">Peso máximo</label>
                            <input
                                type="number"
                                id="weightMax"
                                min="0"
                                placeholder="1000"
                            >
                        </div>

                    </div>

                    <!-- Botó de cerca -->
                    <div class="button-group">
                        <button type="button" id="searchButton">Buscar Pokémon</button>
                    </div>

                </div>
            </div>

            <!-- Zona d'ordenació -->
            <div class="sort-section">
                <label for="orden">Ordenar por:</label>
                <select id="orden">
                    <option value="idAsc">Número ↑</option>
                    <option value="idDesc">Número ↓</option>
                    <option value="nameAsc">Nombre A-Z</option>
                    <option value="nameDesc">Nombre Z-A</option>
                </select>
            </div>

        </div>

        <!-- --------------------------------------------------
            RESULTATS
        --------------------------------------------------
        Contenidor on es mostren els Pokémon segons els
        filtres i l'ordenació seleccionats.
        -------------------------------------------------- -->
        <div id="resultados" class="pokemon-container"></div>

        <!-- Botó per carregar més Pokémon -->
        <button type="button" id="loadMore">Cargar más Pokemons</button>

        <!-- --------------------------------------------------
            SCRIPTS
        --------------------------------------------------
        Fitxers JavaScript necessaris per al funcionament
        de la pàgina.
        -------------------------------------------------- -->
        <script src="../js/ui.js"></script>
        <script src="../js/dades.js"></script>
        <script src="../js/clases.js"></script>
        <script src="../js/aux.js"></script>
        <script src="../js/menu.js"></script>
        <script src="../js/indice.js"></script>

    </body>
</html>
