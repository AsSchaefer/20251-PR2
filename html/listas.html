<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- --------------------------------------------------
         PR2 – Llistes (Mi equipo / Deseos)
    --------------------------------------------------
        Alumna: Alexandra Schäfer Barrientos
        Fitxer: listas.html
        
        Descripció:
        Pàgina per visualitzar les llistes de l’usuari.
        Inclou navbar, selector de llista, contenidors de resultats
        i botó de retorn.
    -------------------------------------------------- -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Lista de Pokemon</title>
</head>

<body>

    <!-- Menú superior -->
    <header>
        <nav class="navbar">
            <div class="navbar-left">
                <img src="../img/pokedex-uoc.png" alt="Pokedex UOC">
            </div>

            <ul class="navbar-right">
                <li><a href="indice.html">Pokemons</a></li>

                <!-- --------------------------------------------------
                En el HTML original aquí faltava tancar </a></li>.
                Això pot “trencar” el DOM del menú i fer que:
                - el dropdown no respongui bé
                - el hover no ocupi correctament
                - el logout sigui difícil de clicar
                -------------------------------------------------- -->
                <li>
                    <a href="listas.html">
                        <span class="nav-text">Listas</span>
                        <i class="fa-solid fa-heart"></i>
                        <span style="font-size: 0.6em;" id="myTeamCount"></span>
                        <i class="fa-solid fa-eye"></i>
                        <span style="font-size: 0.6em;" id="wishesCount"></span>
                    </a>
                </li>

                <li><a href="video.html">Video</a></li>

                <li class="dropdown">
                    <a href="#" class="dropbtn" id="menuButton">Usuario</a>
                    <div class="dropdown-content">
                        <a href="#" id="logoutButton">Logout</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <div class="top-container">

        <div class="sort-section">
            <label for="listSelector">Selecciona una lista:</label>
            <select id="listSelector">
                <option value="myTeam">Mi equipo</option>
                <option value="wishes">Deseos</option>
            </select>
        </div>

        <!-- --------------------------------------------------
             CONTENIDOR "MAIN"
        --------------------------------------------------
        Aquest div NO es toca perquè:
        - És el placeholder on es vol pintar després el contingut
          segons la llista seleccionada.
        - Encara que ara estigui buit, és part de l’estructura.
        -------------------------------------------------- -->
        <div class="main"></div>

        <!-- Contenidor de cards -->
        <div id="listasContainer" class="pokemon-container"></div>

        <!-- Botó tornar -->
        <button type="button" id="backButton">Volver a la Lista de Pokemons</button>

    </div>

    <!-- Scripts al final del body -->
    <script src="../js/dades.js"></script>
    <script src="../js/clases.js"></script>
    <script src="../js/menu.js"></script>
    <!--<script src="../js/aux.js"></script>-->
    <script src="../js/listas.js"></script>

</body>
</html>
