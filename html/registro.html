<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- --------------------------------------------------
        PR2 – Pàgina de REGISTRE
    --------------------------------------------------
    Alumna: Alexandra Schäfer Barrientos
    Fitxer: registro.html

    Descripció:
    Aquesta pàgina conté el formulari de registre d'usuaris
    de l'aplicació. Les dades introduïdes es processen i es
    validen mitjançant JavaScript (registro.js) i, un cop
    validades, s’emmagatzemen a localStorage.

    Seguint l'enunciat de la pràctica, totes les validacions
    es realitzen exclusivament amb JavaScript, evitant
    l'ús de mecanismes de validació HTML natius.
    -------------------------------------------------- -->

    <!-- Icona mostrada a la pestanya del navegador -->
    <link rel="icon" type="image/png" href="../img/pikachu.png">

    <!-- Full d'estils principal del projecte -->
    <link rel="stylesheet" href="../css/styles.css">

    <title>Registro de Usuario</title>
  </head>

  <body>

    <!-- --------------------------------------------------
        CONTENIDOR PRINCIPAL DE REGISTRE
    --------------------------------------------------
    Aquest contenidor agrupa tot el formulari de registre
    i permet presentar-lo visualment com una targeta,
    mantenint una estructura clara i ordenada.
    -------------------------------------------------- -->
    <div id="register">

      <!-- --------------------------------------------------
          FORMULARI DE REGISTRE
      --------------------------------------------------
      El formulari no utilitza el comportament clàssic de
      submit per evitar recàrregues de pàgina. Tota la
      gestió d'enviament i validació es realitza amb
      JavaScript, tal com estableix l'enunciat.
      -------------------------------------------------- -->
      <form id="registerForm" onsubmit="return false;">

        <!-- Títol del formulari -->
        <div>
          <h3>Registro de usuario</h3>
        </div>

        <!-- --------------------------------------------------
            CAMPS DE DADES PERSONALS
        --------------------------------------------------
        Els camps del formulari recullen la informació
        necessària per crear un nou usuari. No s’utilitzen
        atributs de validació HTML (com required o type="email"),
        ja que totes les comprovacions es duen a terme des
        de JavaScript. L'atribut autocomplete es manté per
        millorar l'experiència d'usuari.
        -------------------------------------------------- -->

        <div class="form-group">
          <label for="name">Nombre:</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="given-name"
          >
        </div>

        <div class="form-group">
          <label for="surname">Apellidos:</label>
          <input
            type="text"
            id="surname"
            name="surname"
            autocomplete="family-name"
          >
        </div>

        <div class="form-group">
          <label for="address">Dirección:</label>
          <input
            type="text"
            id="address"
            name="address"
            autocomplete="street-address"
          >
        </div>

        <div class="form-group">
          <label for="city">Población:</label>

          <!-- --------------------------------------------------
              SELECT DE POBLACIONS
          --------------------------------------------------
          El desplegable de poblacions s'omple dinàmicament
          amb JavaScript. L'opció buida inicial actua com a
          valor per defecte, i la validació de la selecció
          es realitza des del codi JavaScript.
          -------------------------------------------------- -->
          <select id="city" name="city">
            <option value="">Seleccione una población</option>
          </select>
        </div>

        <div class="form-group">
          <label for="postalCode">Código Postal:</label>

          <!-- --------------------------------------------------
          Aquest camp utilitza type="text" per permetre la
          introducció de codis amb zeros inicials. L'atribut
          inputmode="numeric" facilita la introducció en
          dispositius mòbils, i autocomplete ajuda a l'usuari
          sense aplicar cap validació automàtica.
          -------------------------------------------------- -->
          <input
            type="text"
            id="postalCode"
            name="postalCode"
            inputmode="numeric"
            autocomplete="postal-code"
          >
        </div>

        <div class="form-group">
          <label for="email">Email:</label>

          <!-- --------------------------------------------------
          El camp d'email es defineix com a text per evitar
          la validació HTML nativa. El format correcte de
          l'adreça de correu es comprova posteriorment
          mitjançant JavaScript.
          -------------------------------------------------- -->
          <input
            type="text"
            id="email"
            name="email"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="username">Usuario:</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
          >
        </div>

        <!-- --------------------------------------------------
            BOTONS D’ACCIÓ
        --------------------------------------------------
        Els botons es defineixen com a type="button" per
        evitar l'enviament automàtic del formulari. El
        comportament associat a cada botó es gestiona
        íntegrament des de registro.js.
        -------------------------------------------------- -->
        <button type="button" id="save">Guardar</button>
        <button type="button" id="loginButton">Volver a Login</button>

      </form>
    </div>

    <!-- --------------------------------------------------
        SCRIPTS
    --------------------------------------------------
    Els scripts es carreguen al final del document per
    assegurar que el DOM està completament disponible.
    L'ordre de càrrega és important, ja que registro.js
    depèn de les dades i de les classes definides
    prèviament.
    -------------------------------------------------- -->
    <script src="../js/ui.js"></script>
    <script src="../js/dades.js"></script>
    <script src="../js/clases.js"></script>
    <script src="../js/registro.js"></script>

  </body>
</html>
