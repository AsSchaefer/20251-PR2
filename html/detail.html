<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- --------------------------------------------------
    PR2 – Detall de Pokémon
    --------------------------------------------------
    Alumna: Alexandra Schäfer Barrientos
    Fitxer: detail.html
    Descripció:
    Pàgina de detall d’un Pokémon concret.
    Mostra navbar superior, contenidor de detall (renderitzat per JS)
    i botó per tornar al llistat.
    -------------------------------------------------- -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Detalle Pokémon</title>
</head>

<body>

    <!-- --------------------------------------------------
    MENÚ SUPERIOR (NAVBAR)
    --------------------------------------------------
    IMPORTANT:
    - Cal tancar bé <a> i <li> per evitar que el DOM quedi trencat.
    - Si falta algun tancament, el dropdown pot deixar de funcionar
      (hover / click / logout).
    -------------------------------------------------- -->
    <header>
        <nav class="navbar">
            <div class="navbar-left">
                <img src="../img/pokedex-uoc.png" alt="Pokedex UOC">
            </div>

            <ul class="navbar-right">
                <li><a href="indice.html">Pokemons</a></li>

                <!-- IMPORTANT: tanquem bé </a> i </li> -->
                <li>
                    <a href="listas.html">
                        <span class="nav-text">Listas</span>
                        <i class="fa-solid fa-heart"></i>
                        <span style="font-size: 0.6em;" id="myTeamCount"></span>
                        <i class="fa-solid fa-eye"></i>
                        <span style="font-size: 0.6em;" id="wishesCount"></span>
                    </a>
                </li>

                <li><a href="video.html">Video</a></li>

                <li class="dropdown">
                    <a href="#" class="dropbtn" id="menuButton">Usuario</a>
                    <div class="dropdown-content">
                        <a href="#" id="logoutButton">Logout</a>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <!-- --------------------------------------------------
    CONTINGUT PRINCIPAL
    --------------------------------------------------
    - #pokemonDetail es renderitza amb detail.js
    - Mostra un "Cargando..." mentre arriba la informació
    -------------------------------------------------- -->
    <main>
        <div style="display: flex; justify-content: center;">
            <div id="pokemonDetail" class="pokedex-card">
                <p>Cargando...</p>
            </div>
        </div>

        <!-- Botó tornar al llistat -->
        <div>
            <button id="backButton" class="back-button">← Volver al listado</button>
        </div>
    </main>

    <!-- --------------------------------------------------
    SCRIPTS (al final del body)
    --------------------------------------------------
    Es carreguen al final per assegurar que el DOM existeix
    abans d’executar JS.
    -------------------------------------------------- -->
    <script src="../js/dades.js"></script>
    <script src="../js/clases.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/aux.js"></script>
    <script src="../js/detail.js"></script>

</body>
</html>
