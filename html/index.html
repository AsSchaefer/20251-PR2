<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- --------------------------------------------------
            PR2 – Pàgina de LOGIN
        --------------------------------------------------
        Alumna: Alexandra Schäfer Barrientos
        Fitxer: index.html

        Descripció:
        Pantalla inicial de l'aplicació. Permet a l'usuari
        introduir les seves credencials per accedir a
        l'aplicació o dirigir-se a la pàgina de registre.
        -------------------------------------------------- -->

        <!-- Icona de la pestanya del navegador -->
        <link rel="icon" type="image/png" href="../img/pikachu.png">

        <!-- Full d'estils principal del projecte -->
        <link rel="stylesheet" href="../css/styles.css">

        <title>Pokedex UOC</title>
    </head>

    <body>

        <!-- --------------------------------------------------
            CONTENIDOR PRINCIPAL DE LOGIN
        --------------------------------------------------
        Contenidor que agrupa el logotip i el formulari
        d'accés a l'aplicació.
        -------------------------------------------------- -->
        <div id="login">

            <!-- Logotip de l’aplicació -->
            <div id="login_img">
                <img src="../img/pokedex-uoc.png" alt="Pokedex UOC">
            </div>

            <!-- --------------------------------------------------
                FORMULARI DE LOGIN
            --------------------------------------------------
            Formulari d'accés on l'usuari introdueix el nom
            d'usuari i la contrasenya per iniciar sessió.
            -------------------------------------------------- -->
            <form id="loginForm" onsubmit="return false;">

                <!-- Camp d’usuari -->
                <div class="form-group">
                    <label for="username">Usuario:</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                    >
                </div>

                <!-- Camp de contrasenya -->
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                    >
                </div>

                <!-- Botons d'acció -->
                <button type="button" id="loginButton">Aceptar</button>
                <button type="button" id="registration">Nuevo usuario</button>

            </form>
        </div>

        <!-- --------------------------------------------------
            SCRIPTS
        --------------------------------------------------
        Fitxers JavaScript necessaris per a la lògica de
        l'aplicació i la gestió del login.
        -------------------------------------------------- -->
        <script src="../js/ui.js"></script>
        <script src="../js/clases.js"></script>
        <script src="../js/index.js"></script>

    </body>
</html>
