<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- --------------------------------------------------
         PR2 – Pàgina de LOGIN
    --------------------------------------------------
    Alumna: Alexandra Schäfer Barrientos
    Fitxer: index.html
    
    Descripció:
    Pantalla inicial de l’aplicació.
    Permet a l’usuari introduir credencials i accedir
    a la pàgina de registre.
    -------------------------------------------------- -->

    <!-- Full d’estils principal del projecte -->
    <link rel="stylesheet" href="../css/styles.css">

    <title>Pokedex UOC</title>
</head>

<body>

    <!-- --------------------------------------------------
         CONTENIDOR PRINCIPAL DE LOGIN
    -------------------------------------------------- -->
    <div id="login">

        <!-- LOGO -->
        <div id="login_img">
            <img src="../img/pokedex-uoc.png" alt="Pokedex UOC">
        </div>

        <!-- --------------------------------------------------
             FORMULARI DE LOGIN
        -------------------------------------------------- -->
        <form id="loginForm" onsubmit="return false;">

            <!-- Camp usuari -->
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                >
            </div>

            <!-- Camp contrasenya -->
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                >
            </div>

            <!-- Botons -->
            <button type="button" id="loginButton">Aceptar</button>
            <button type="button" id="registration">Nuevo usuario</button>

        </form>
    </div>

    <!-- SCRIPTS -->
    <script src="../js/clases.js"></script>
    <script src="../js/index.js"></script>

</body>
</html>
